<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Zenith OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#0b0f1a] text-slate-300">
    <div class="flex h-screen">
        <aside class="w-64 bg-[#111827] border-r border-slate-800 p-6 flex flex-col">
            <div class="text-blue-500 font-bold text-xl mb-10">ZENITH CORE</div>
            <nav id="menu" class="space-y-2 flex-1">
                <button onclick="show('dash')" class="w-full text-left p-3 hover:bg-slate-800 rounded-lg shadow-sm"><i class="fas fa-home mr-3"></i>Дашборд</button>
                </nav>
            <div class="pt-4 border-t border-slate-800">
                <button onclick="show('install')" class="w-full text-left p-3 text-green-500 hover:bg-slate-800 rounded-lg"><i class="fas fa-plus-circle mr-3"></i>Установить ZIP</button>
            </div>
        </aside>

        <main class="flex-1 p-10 overflow-auto">
            <div id="view-dash" class="view">
                <h2 class="text-3xl font-bold mb-8">Дашборд</h2>
                <div id="widgets" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-[#161e2d] p-6 rounded-2xl border border-slate-800">
                        <p class="text-slate-500 text-xs uppercase font-bold">Система</p>
                        <div class="mt-4 space-y-2">
                            <p>CPU: <span id="cpu" class="text-green-400">0%</span></p>
                            <p>RAM: <span id="ram" class="text-blue-400">0%</span></p>
                        </div>
                    </div>
                    </div>
            </div>

            <div id="view-install" class="view hidden">
                <h2 class="text-3xl font-bold mb-8">Установка нового модуля</h2>
                <input type="file" id="zip-input" class="mb-4 block">
                <button onclick="installModule()" class="bg-blue-600 px-10 py-3 rounded-xl font-bold">Загрузить архив</button>
            </div>

            <div id="module-container" class="view hidden">
                </div>
        </main>
    </div>

    <script>
        let modules = [];

        async function init() {
            // 1. Загружаем статистику
            setInterval(async () => {
                const r = await fetch('/api/stats');
                const d = await r.json();
                document.getElementById('cpu').innerText = d.cpu + '%';
                document.getElementById('ram').innerText = d.ram + '%';
            }, 2000);

            // 2. Загружаем список модулей и строим меню
            const res = await fetch('/api/modules/list');
            modules = await res.json();
            const menu = document.getElementById('menu');
            
            modules.forEach(m => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 hover:bg-slate-800 rounded-lg transition";
                btn.innerHTML = `<i class="${m.icon} mr-3"></i>${m.name}`;
                btn.onclick = () => loadModule(m);
                menu.appendChild(btn);

                // Если у модуля есть виджет, добавляем на Дашборд
                if(m.widget_html) {
                    const w = document.createElement('div');
                    w.className = "bg-[#161e2d] p-6 rounded-2xl border border-slate-800";
                    w.innerHTML = m.widget_html;
                    document.getElementById('widgets').appendChild(w);
                }
            });
        }

        function show(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-' + id).classList.remove('hidden');
        }

        function loadModule(m) {
            show('container');
            const container = document.getElementById('module-container');
            container.innerHTML = `<h2 class="text-3xl font-bold mb-8">${m.name}</h2>` + m.main_html;
            // Исполняем скрипты модуля, если они есть
            if(m.script) eval(m.script);
        }

        async function installModule() {
            const file = document.getElementById('zip-input').files[0];
            const fd = new FormData();
            fd.append("file", file);
            await fetch('/api/modules/upload', {method: 'POST', body: fd});
            location.reload();
        }

        init();
    </script>
</body>
</html>
