<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Zenith OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#0b0f1a] text-slate-300">
    <div class="flex h-screen">
        <aside class="w-64 bg-[#111827] border-r border-slate-800 p-6 flex flex-col">
            <div class="text-blue-500 font-bold text-xl mb-10 font-mono italic">ZENITH CORE</div>
            <nav class="space-y-1 flex-1">
                <button onclick="show('dash')" class="w-full text-left p-3 hover:bg-slate-800 rounded-lg"><i class="fas fa-home mr-3"></i>Дашборд</button>
                <button onclick="show('users')" class="w-full text-left p-3 hover:bg-slate-800 rounded-lg"><i class="fas fa-users mr-3"></i>Пользователи</button>
                <button onclick="show('logs')" class="w-full text-left p-3 hover:bg-slate-800 rounded-lg"><i class="fas fa-terminal mr-3"></i>Логи</button>
                <button onclick="show('settings')" class="w-full text-left p-3 hover:bg-slate-800 rounded-lg"><i class="fas fa-cog mr-3"></i>Настройки</button>
                <div class="border-t border-slate-800 my-4 pt-4 text-[10px] text-slate-500 px-3 uppercase">Модули</div>
                <div id="mod-menu"></div>
            </nav>
            <button onclick="show('install')" class="mt-4 w-full bg-blue-600 p-3 rounded-lg font-bold">Установить ZIP</button>
        </aside>

        <main class="flex-1 p-10 overflow-auto">
            <div id="view-dash" class="view">
                <h2 class="text-3xl font-bold mb-8">Система</h2>
                <div class="grid grid-cols-3 gap-6" id="widgets">
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                        <p class="text-slate-500 text-xs uppercase mb-2">Нагрузка</p>
                        <div class="text-2xl font-mono">CPU: <span id="cpu" class="text-green-400">0%</span></div>
                        <div class="text-2xl font-mono">RAM: <span id="ram" class="text-blue-400">0%</span></div>
                    </div>
                </div>
            </div>

            <div id="view-users" class="view hidden text-center py-20 text-slate-500">Управление пользователями (База данных активна)</div>
            <div id="view-logs" class="view hidden text-center py-20 text-slate-500">Логи системы временно пусты</div>
            <div id="view-settings" class="view hidden text-center py-20 text-slate-500">Настройки ядра v1.0.4</div>

            <div id="view-install" class="view hidden">
                <h2 class="text-3xl font-bold mb-8 text-center">Загрузка модуля</h2>
                <div class="max-w-md mx-auto bg-slate-900 p-10 rounded-3xl border-2 border-dashed border-slate-800 text-center">
                    <input type="file" id="zip-file" class="mb-6 block w-full text-sm">
                    <button onclick="install()" class="bg-green-600 w-full py-4 rounded-xl font-bold">УСТАНОВИТЬ</button>
                </div>
            </div>

            <div id="mod-container" class="view hidden"></div>
        </main>
    </div>

    <script>
        async function init() {
            setInterval(async () => {
                const r = await fetch('/api/stats');
                const d = await r.json();
                document.getElementById('cpu').innerText = d.cpu + '%';
                document.getElementById('ram').innerText = d.ram + '%';
            }, 2000);

            const res = await fetch('/api/modules/list');
            const mods = await res.json();
            const menu = document.getElementById('mod-menu');
            const widgets = document.getElementById('widgets');

            mods.forEach(m => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 hover:bg-slate-800 rounded-lg text-slate-400";
                btn.innerHTML = `<i class="${m.icon} mr-3"></i>${m.name}`;
                btn.onclick = () => {
                    document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
                    const cont = document.getElementById('mod-container');
                    cont.classList.remove('hidden');
                    cont.innerHTML = `<h2 class="text-3xl font-bold mb-8">${m.name}</h2>` + m.main_html;
                    if(m.script) eval(m.script);
                };
                menu.appendChild(btn);

                if(m.widget_html) {
                    const w = document.createElement('div');
                    w.className = "bg-slate-900 p-6 rounded-2xl border border-slate-800";
                    w.innerHTML = m.widget_html;
                    widgets.appendChild(w);
                }
            });
        }

        function show(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-' + id).classList.remove('hidden');
        }

        async function install() {
            const fd = new FormData();
            fd.append("file", document.getElementById('zip-file').files[0]);
            await fetch('/api/modules/upload', {method: 'POST', body: fd});
            location.reload();
        }

        init();
    </script>
</body>
</html>
