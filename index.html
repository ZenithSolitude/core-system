<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Zenith OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#0b0f1a] text-slate-300">
    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-[#111827] border-r border-slate-800 p-6 flex flex-col">
            <div class="text-blue-500 font-bold text-xl mb-10 font-mono italic">ZENITH CORE</div>
            <nav class="space-y-1 flex-1">
                <button onclick="show('dash')" class="w-full text-left p-3 hover:bg-slate-800 rounded-lg"><i class="fas fa-home mr-3 text-blue-400"></i>Дашборд</button>
                <button onclick="show('users')" class="w-full text-left p-3 hover:bg-slate-800 rounded-lg"><i class="fas fa-users mr-3 text-purple-400"></i>Пользователи</button>
                <button onclick="show('logs')" class="w-full text-left p-3 hover:bg-slate-800 rounded-lg"><i class="fas fa-terminal mr-3 text-green-400"></i>Логи</button>
                <button onclick="show('mod-mgr')" class="w-full text-left p-3 hover:bg-slate-800 rounded-lg"><i class="fas fa-tasks mr-3 text-orange-400"></i>Управление</button>
                <div class="border-t border-slate-800 my-4 pt-4 text-[10px] text-slate-500 px-3 uppercase">Модули</div>
                <div id="mod-menu"></div>
            </nav>
            <button onclick="show('install')" class="mt-4 w-full bg-blue-600 text-white p-3 rounded-lg text-sm font-bold">ЗАГРУЗИТЬ ZIP</button>
        </aside>

        <main class="flex-1 p-10 overflow-auto">
            <div id="view-dash" class="view">
                <h2 class="text-3xl font-bold mb-8">Система</h2>
                <div class="grid grid-cols-3 gap-6" id="widgets-box">
                    <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                        <p class="text-slate-500 text-[10px] uppercase font-bold mb-2">Нагрузка CPU</p>
                        <p id="cpu" class="text-3xl font-mono text-green-400">0%</p>
                    </div>
                </div>
            </div>

            <div id="view-users" class="view hidden">
                <h2 class="text-3xl font-bold mb-8 text-white">Аккаунты</h2>
                <div id="user-list" class="bg-slate-900 p-6 rounded-2xl border border-slate-800"></div>
            </div>

            <div id="view-logs" class="view hidden">
                <h2 class="text-3xl font-bold mb-8 text-white">Логи</h2>
                <div id="log-content" class="bg-black p-6 rounded-xl font-mono text-green-500 text-sm h-96 overflow-auto border border-slate-800"></div>
            </div>

            <div id="view-mod-mgr" class="view hidden">
                <h2 class="text-3xl font-bold mb-8 text-white">Список модулей</h2>
                <div id="full-mod-list" class="grid gap-4"></div>
            </div>

            <div id="view-install" class="view hidden">
                <h2 class="text-3xl font-bold mb-8 text-white">Установка</h2>
                <input type="file" id="zip-in" class="mb-4 block">
                <button onclick="installZip()" class="bg-blue-600 px-10 py-3 rounded-xl font-bold text-white">ОТПРАВИТЬ ФАЙЛ</button>
            </div>

            <div id="view-mod-container" class="view hidden"></div>
        </main>
    </div>

    <script>
        async function loadData() {
            const r = await fetch('/api/modules/list');
            const mods = await r.json();
            
            const menu = document.getElementById('mod-menu');
            const mgr = document.getElementById('full-mod-list');
            menu.innerHTML = ''; 
            mgr.innerHTML = '';

            mods.forEach(m => {
                // Кнопка в меню
                const b = document.createElement('button');
                b.className = "w-full text-left p-3 hover:bg-slate-800 rounded-lg text-slate-400";
                b.innerHTML = `<i class="${m.icon} mr-3"></i>${m.name}`;
                b.onclick = () => {
                    show('mod-container');
                    document.getElementById('view-mod-container').innerHTML = `<h2 class="text-3xl font-bold mb-8 text-white">${m.name}</h2>` + m.main_html;
                    if(m.script) eval(m.script);
                };
                menu.appendChild(b);

                // Карточка в управлении
                mgr.innerHTML += `<div class="bg-slate-900 p-6 rounded-xl border border-slate-800 flex justify-between">
                    <span>${m.name}</span>
                    <button onclick="delMod('${m.id}')" class="text-red-500 font-bold">УДАЛИТЬ</button>
                </div>`;
            });
            
            // Загрузка юзеров
            const ur = await fetch('/api/users');
            const users = await ur.json();
            document.getElementById('user-list').innerHTML = users.map(u => `<div class="py-2 border-b border-slate-800">${u.user} - ${u.role}</div>`).join('');
            
            // Загрузка логов
            const lr = await fetch('/api/logs');
            const logs = await lr.json();
            document.getElementById('log-content').innerHTML = logs.map(l => `<div>${l.entry}</div>`).join('');
        }

        function show(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-' + id).classList.remove('hidden');
            loadData();
        }

        async function installZip() {
            const fd = new FormData();
            fd.append("file", document.getElementById('zip-in').files[0]);
            await fetch('/api/modules/upload', {method:'POST', body:fd});
            location.reload();
        }

        async function delMod(id) {
            if(confirm('Снести модуль?')) {
                await fetch('/api/modules/'+id, {method:'DELETE'});
                location.reload();
            }
        }

        setInterval(async () => {
            const r = await fetch('/api/stats');
            const d = await r.json();
            document.getElementById('cpu').innerText = d.cpu + '%';
        }, 3000);

        loadData();
    </script>
</body>
