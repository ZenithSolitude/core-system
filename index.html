<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Zenith Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#0f172a] text-slate-200">
    <div class="flex h-screen">
        <aside class="w-64 bg-[#1e293b] border-r border-slate-700 p-6 flex flex-col">
            <div class="text-xl font-bold text-blue-400 mb-8"><i class="fas fa-terminal mr-2"></i>ZenithCore</div>
            <nav class="space-y-3 flex-1">
                <button onclick="show('dash')" class="block w-full text-left p-2 hover:bg-slate-700 rounded"><i class="fas fa-chart-pie mr-2"></i> Дашборд</button>
                <button onclick="show('photo')" class="block w-full text-left p-2 hover:bg-slate-700 rounded"><i class="fas fa-image mr-2"></i> Фото-Модуль</button>
                <button onclick="show('logs')" class="block w-full text-left p-2 hover:bg-slate-700 rounded"><i class="fas fa-list mr-2"></i> Логи</button>
            </nav>
            <a href="/api/logout" class="text-red-400 hover:underline mt-auto">Выйти</a>
        </aside>

        <main class="flex-1 p-10 overflow-y-auto">
            <section id="sec-dash" class="tab">
                <h2 class="text-2xl mb-6 font-bold">Мониторинг</h2>
                <div class="grid grid-cols-3 gap-6">
                    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center">
                        <p class="text-slate-400">CPU</p>
                        <p id="cpu" class="text-3xl text-green-400 font-mono">0%</p>
                    </div>
                    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center">
                        <p class="text-slate-400">RAM</p>
                        <p id="ram" class="text-3xl text-blue-400 font-mono">0%</p>
                    </div>
                </div>
            </section>

            <section id="sec-photo" class="tab hidden">
                <h2 class="text-2xl mb-6 font-bold">Анонимная Галерея</h2>
                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                    <input type="file" id="img-file" class="mb-4 text-sm">
                    <button onclick="upPhoto()" class="bg-blue-600 px-4 py-1 rounded">Загрузить в облако</button>
                    <div id="gallery" class="grid grid-cols-4 gap-4 mt-8"></div>
                </div>
            </section>

            <section id="sec-logs" class="tab hidden">
                <h2 class="text-2xl mb-6 font-bold">Логи</h2>
                <div id="log-box" class="bg-black p-4 font-mono text-green-500 h-80 overflow-y-auto rounded shadow-inner"></div>
            </section>
        </main>
    </div>

    <script>
        function show(id) {
            document.querySelectorAll('.tab').forEach(t => t.classList.add('hidden'));
            document.getElementById('sec-'+id).classList.remove('hidden');
            if(id === 'photo') loadPhotos();
            if(id === 'logs') loadLogs();
        }

        async function updateStats() {
            const res = await fetch('/api/stats');
            const d = await res.json();
            document.getElementById('cpu').innerText = d.cpu + '%';
            document.getElementById('ram').innerText = d.ram + '%';
        }
        setInterval(updateStats, 2000);

        async function upPhoto() {
            const file = document.getElementById('img-file').files[0];
            const formData = new FormData();
            formData.append("file", file);
            await fetch('/api/photos/upload', {method: 'POST', body: formData});
            loadPhotos();
        }

        async function loadPhotos() {
            const res = await fetch('/api/photos/list');
            const data = await res.json();
            document.getElementById('gallery').innerHTML = data.map(url => `
                <div class="bg-slate-700 p-1 rounded">
                    <img src="${url}" class="w-full h-32 object-cover rounded">
                    <p class="text-[10px] truncate mt-1">${url}</p>
                </div>
            `).join('');
        }

        async function loadLogs() {
            const res = await fetch('/api/logs');
            const data = await res.json();
            document.getElementById('log-box').innerHTML = data.map(l => `<div>> ${l.entry}</div>`).join('');
        }
    </script>
</body>
</html>
