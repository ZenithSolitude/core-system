<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в ZenithCore</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-96 border border-slate-700">
        <h2 class="text-2xl font-bold text-white mb-6 text-center">Авторизация</h2>
        <input id="user" type="text" placeholder="Логин" class="w-full mb-4 p-2 rounded bg-slate-700 text-white outline-none focus:ring-2 ring-blue-500">
        <input id="pass" type="password" placeholder="Пароль" class="w-full mb-6 p-2 rounded bg-slate-700 text-white outline-none focus:ring-2 ring-blue-500">
        <button onclick="doLogin()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded font-bold transition">Войти</button>
        <p id="err" class="text-red-500 mt-4 text-center hidden">Ошибка входа!</p>
    </div>
    <script>
        async function doLogin() {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user.value, password: pass.value})
            });
            if (res.ok) { location.reload(); } 
            else { document.getElementById('err').classList.remove('hidden'); }
        }
    </script>
</body>
</html>
