<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Вход | Zenith</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f1a] text-white flex items-center justify-center h-screen">
    <div class="bg-slate-900 p-10 rounded-3xl border border-slate-800 w-96 shadow-2xl">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-500 font-mono">ZENITH AUTH</h2>
        <input id="u" type="text" placeholder="Логин" class="w-full bg-slate-800 p-3 rounded-xl mb-4 outline-none border border-slate-700 focus:border-blue-500">
        <input id="p" type="password" placeholder="Пароль" class="w-full bg-slate-800 p-3 rounded-xl mb-6 outline-none border border-slate-700 focus:border-blue-500">
        <button onclick="doLogin()" class="w-full bg-blue-600 p-3 rounded-xl font-bold hover:bg-blue-500 transition">ВОЙТИ</button>
        <p id="err" class="text-red-500 text-xs mt-4 text-center"></p>
    </div>
    <script>
        async function doLogin() {
            const user = document.getElementById('u').value;
            const pass = document.getElementById('p').value;
            const r = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({user, pass})
            });
            const d = await r.json();
            if(d.ok) { window.location.reload(); }
            else { document.getElementById('err').innerText = 'Ошибка: ' + (d.msg || 'Неверные данные'); }
        }
    </script>
</body>
</html>
